<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form with Iframe</title>
</head>
<body>
  <h1>Form Submission with Iframe</h1>
  <form target="resultFrame" action="result.html" method="get">
    <label for="input">Enter Text:</label>
    <input type="text" id="input" name="input">
    <button type="submit">Submit</button>
  </form>
  <iframe name="resultFrame" width="80%" height="80" title="Result"></iframe>
</body>
</html>
