<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Form</title>
</head>
<body>
  <h1>Contact Us</h1>
  <form>
    <label for="fullname">Full Name:</label>
    <input type="text" id="fullname" name="fullname" placeholder="Your Name" required><br><br>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="your@email.com" required><br><br>
    <label for="subject">Subject:</label>
    <input type="text" id="subject" name="subject" placeholder="Subject" required><br><br>
    <label for="message">Message:</label><br>
    <textarea id="message" name="message" placeholder="Type your message here..." required></textarea><br><br>
    <button type="submit">Send</button>
  </form>
</body>
</html>
