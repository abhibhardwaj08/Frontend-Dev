<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Complete Layout</title><link rel="stylesheet" href="q10.css"></head><body>
<header class="sticky-top">
  <nav class="nav"><a href="#">Home</a><a href="#about">About</a><a href="#services">Services</a><a href="#contact">Contact</a></nav>
</header>

<section class="hero">
  <div class="hero-text"><h1>Welcome to Our Service</h1><p>Centered hero with background image and overlay.</p></div>
</section>

<section id="about" class="about">
  <div class="about-inner">
    <div class="text"><h2>About Us</h2><p>We build reliable cloud solutions and beautiful front-ends.</p></div>
    <div class="img"><img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><rect fill='%23e3e3e3' width='100%' height='100%'/><text x='50%' y='50%' font-size='28' text-anchor='middle' alignment-baseline='middle' fill='%23666'>Profile</text></svg>" alt="about image"></div>
  </div>
</section>

<section id="services" class="services">
  <div class="cards">
    <div class="service">Service 1</div>
    <div class="service">Service 2</div>
    <div class="service">Service 3</div>
  </div>
</section>

<section id="contact" class="contact">
  <form><label>Name<input type="text"></label><label>Email<input type="email"></label><button>Send</button></form>
</section>

<footer class="footer">© 2025 Company. All rights reserved.</footer>
</body></html>
