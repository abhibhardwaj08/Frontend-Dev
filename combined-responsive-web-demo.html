<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Combined Responsive Web Demo</title>
  <link rel="stylesheet" href="combined-responsive-web-demo.css">
</head>
<body>
  <header class="top">
    <div class="logo">DemoSite</div>
    <nav><a href="#">Home</a> <a href="#">About</a> <a href="#">Cheatsheet</a></nav>
  </header>
  <main class="grid">
    <section class="gallery-preview">
      <h2>Gallery</h2>
      <div class="mini-grid">
        <img src="https://picsum.photos/seed/a/300/200" alt="">
        <img src="https://picsum.photos/seed/b/300/200" alt="">
        <img src="https://picsum.photos/seed/c/300/200" alt="">
      </div>
    </section>
    <section class="explain">
      <h2>Responsive Design</h2>
      <p>Responsive design adapts layout to the user's device using flexible grids, media queries and fluid media.</p>
    </section>
    <section class="cheat-preview">
      <h2>Cheat Sheet Preview</h2>
      <ul>
        <li>Use grid & flex</li>
        <li>Use clamp() for typography</li>
        <li>Use responsive images</li>
      </ul>
    </section>
  </main>
  <footer>Contact: demo@example.com</footer>
</body>
</html>
