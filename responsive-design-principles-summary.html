<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Responsive Design Principles Summary</title>
  <link rel="stylesheet" href="responsive-design-principles-summary.css">
</head>
<body>
  <main class="principles">
    <section class="box">
      <h3>Fluid Layouts</h3>
      <p>Layouts that use percentages and flexible units.</p>
      <pre><code>.container{width:90%;}</code></pre>
    </section>
    <section class="box">
      <h3>Flexible Media</h3>
      <p>Images and videos that scale with container.</p>
      <pre><code>img{max-width:100%;height:auto;}</code></pre>
    </section>
    <section class="box">
      <h3>Breakpoints</h3>
      <p>Define points where layout changes.</p>
      <pre><code>@media (max-width:600px){...}</code></pre>
    </section>
  </main>
</body>
</html>
