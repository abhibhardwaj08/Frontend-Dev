<!-- Course Registration Form -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Course Registration</title>
</head>
<body>
  <h1>Course Registration Form</h1>
  <form>
    <fieldset>
      <legend>Student Information</legend>
      <label for="name">Name:</label>
      <input type="text" id="name" name="name"><br><br>
      <label for="email">Email:</label>
      <input type="email" id="email" name="email"><br><br>
      <label for="course">Select Course:</label>
      <select id="course" name="course">
        <option selected>Web Development</option>
        <option>Data Science</option>
        <option>Graphic Design</option>
      </select>
    </fieldset>
  </form>
  <h2>Available Course Schedules</h2>
  <table border="1">
    <tr><th>Day</th><th>Time</th><th>Instructor</th></tr>
    <tr><td>Monday</td><td>10:00 AM</td><td>Mr. Smith</td></tr>
    <tr><td>Wednesday</td><td>2:00 PM</td><td>Ms. Lee</td></tr>
    <tr><td>Friday</td><td>11:00 AM</td><td>Dr. Brown</td></tr>
  </table>
</body>
</html>
