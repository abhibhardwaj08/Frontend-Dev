<!-- Dropdown-based Selection Page -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dropdown Selection</title>
</head>
<body>
  <h1>Choose Your Preferences</h1>
  <form>
    <label for="country">Country:</label>
    <select id="country" name="country">
      <option selected>India</option>
      <option>USA</option>
      <option>UK</option>
    </select><br><br>
    <label for="state">State:</label>
    <select id="state" name="state">
      <option selected>Maharashtra</option>
      <option>California</option>
      <option>London</option>
    </select><br><br>
    <label for="city">City:</label>
    <select id="city" name="city">
      <option selected>Mumbai</option>
      <option>Los Angeles</option>
      <option>London</option>
    </select><br><br>
    <label for="place">Favorite Tourist Place:</label>
    <select id="place" name="place">
      <option selected>Gateway of India</option>
      <option>Statue of Liberty</option>
      <option>Big Ben</option>
    </select>
  </form>
  <p>Your choices: India, Maharashtra, Mumbai, Gateway of India.</p>
</body>
</html>
