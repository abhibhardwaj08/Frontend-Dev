<!-- Product Catalog Page -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Catalog</title>
</head>
<body>
  <h1>Online Store Product Catalog</h1>
  <table border="1">
    <caption>Featured Products</caption>
    <tr>
      <th>Product Name</th>
      <th>Description</th>
      <th>Price</th>
      <th>Availability</th>
      <th>Image</th>
    </tr>
    <tr>
      <td rowspan="2">Smartphone</td>
      <td>Latest model, 128GB storage</td>
      <td>$699</td>
      <td>In Stock</td>
      <td><img src="https://via.placeholder.com/60" alt="Smartphone"></td>
    </tr>
    <tr>
      <td colspan="3">Special Offer: Free shipping!</td>
      <td><img src="https://via.placeholder.com/60" alt="Smartphone"></td>
    </tr>
    <tr>
      <td>Laptop</td>
      <td>15-inch, 16GB RAM</td>
      <td>$999</td>
      <td>Out of Stock</td>
      <td><img src="https://via.placeholder.com/60" alt="Laptop"></td>
    </tr>
    <tr>
      <td>Headphones</td>
      <td>Noise-cancelling</td>
      <td>$199</td>
      <td>In Stock</td>
      <td><img src="https://via.placeholder.com/60" alt="Headphones"></td>
    </tr>
  </table>
</body>
</html>
