<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Responsive CSS Cheat Sheet</title>
  <link rel="stylesheet" href="responsive-css-cheatsheet.css">
</head>
<body>
  <main class="cheatsheet">
    <article class="topic">
      <h4>Filters</h4>
      <p>Use <code>filter: grayscale(100%);</code> or <code>brightness(0.8)</code></p>
    </article>
    <article class="topic">
      <h4>Media Queries</h4>
      <p>@media (max-width: 900px) { ... }</p>
    </article>
    <article class="topic">
      <h4>Responsive Design</h4>
      <p>Combine flexible layout + fluid images + breakpoints.</p>
    </article>
    <article class="topic">
      <h4>Typography</h4>
      <p>Use <code>clamp()</code> and relative units for scalable text.</p>
    </article>
  </main>
</body>
</html>
