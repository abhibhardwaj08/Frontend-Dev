<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q10 — Mini UI Layout</title>
<link rel="stylesheet" href="question10.css"></head>
<body>
<header class="site-header"><h1>Mini UI</h1></header>
<main>
  <article class="card">
    <form class="form">
      <label>Full name<input type="text" placeholder="Your name"></label>
      <label>Email<input type="email" placeholder="you@example.com"></label>
      <div class="row">
        <button type="submit" class="btn">Submit</button>
        <button type="reset" class="btn outline">Reset</button>
      </div>
    </form>
    <img src="" alt="placeholder" class="small-img" aria-hidden="true">
  </article>
</main>
<footer><small>Q10 — Mini UI</small></footer>
</body>
</html>
